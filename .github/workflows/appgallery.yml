name: AppGallery

# Manual only — a store upload is not something a push should do by accident.
# Actions → AppGallery → Run workflow, and pick the release tag (v1.1, …) under
# "Use workflow from": the store gets exactly the tagged build and its notes, with
# the version from gradle.properties, the same as the GitHub Release. Leave
# "submit for review" off for the first run: upload, check the draft in the AGC
# console, then submit there.
on:
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: 'Submit for review after upload'
        type: boolean
        required: false
        default: false

concurrency:
  group: appgallery
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Require a release tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Run this workflow from a v* release tag (\"Use workflow from\"), not from ${{ github.ref_name }}."
          exit 1

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the version check compares with the previous tag

      - name: Check tag matches gradle.properties
        run: tools/check-release-version.sh "$GITHUB_REF_NAME"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane and plugins
        run: bundle install --jobs 4 --retry 3

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Upload to AppGallery
        env:
          # Same signing variables as release.yml; Gradle reads them directly.
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          HUAWEI_CLIENT_ID: ${{ secrets.HUAWEI_CLIENT_ID }}
          HUAWEI_CLIENT_SECRET: ${{ secrets.HUAWEI_CLIENT_SECRET }}
          HUAWEI_APP_ID: ${{ secrets.HUAWEI_APP_ID }}
        run: |
          if [ "${{ inputs.submit_for_review }}" = "true" ]; then
            bundle exec fastlane release_huawei
          else
            bundle exec fastlane deploy_huawei
          fi
