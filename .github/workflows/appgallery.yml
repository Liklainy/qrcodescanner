name: AppGallery

# Manual only — a store upload is not something a push should do by accident.
# Actions → AppGallery → Run workflow. Leave "submit for review" off for the
# first run: upload, check the draft in the AGC console, then submit there.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName (blank = value from gradle.properties)'
        required: false
        default: ''
      version_code:
        description: 'versionCode (blank = value from gradle.properties; must beat the last upload)'
        required: false
        default: ''
      submit_for_review:
        description: 'Submit for review after upload'
        type: boolean
        required: false
        default: false

concurrency:
  group: appgallery
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane and plugins
        run: bundle install --jobs 4 --retry 3

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Upload to AppGallery
        env:
          # Same signing variables as release.yml; Gradle reads them directly.
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          HUAWEI_CLIENT_ID: ${{ secrets.HUAWEI_CLIENT_ID }}
          HUAWEI_CLIENT_SECRET: ${{ secrets.HUAWEI_CLIENT_SECRET }}
          HUAWEI_APP_ID: ${{ secrets.HUAWEI_APP_ID }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          # The Fastfile treats these as "set or absent", so drop them when blank.
          if [ -z "$VERSION_NAME" ]; then unset VERSION_NAME; fi
          if [ -z "$VERSION_CODE" ]; then unset VERSION_CODE; fi
          if [ "${{ inputs.submit_for_review }}" = "true" ]; then
            bundle exec fastlane release_huawei
          else
            bundle exec fastlane deploy_huawei
          fi
